plugins {
    id 'com.gradleup.shadow' version '8.3.6'
    id 'net.neoforged.gradle.userdev' version '7.0.170'
}

apply plugin: 'com.gradleup.shadow'

group = 'fr.modcraftmc'
version = '1.0-SNAPSHOT'

java {
    archivesBaseName = 'ModcraftMod'
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

runs {
    // applies to all the run configs below
    configureEach {
        // Recommended logging data for a userdev environment
        // The markers can be added/remove as needed separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        // Recommended logging level for the console
        // You can set various levels here.
        // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    // This run config launches GameTestServer and runs all registered gametests, then exits.
    // By default, the server will crash when no gametests are provided.
    // The gametest system is also enabled by default for other run configs under the /test command.
    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
        // workingDirectory project.file('run-data')

        // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

configurations {
    // Create the library configuration, where our non-mod libraries will be added to
    library
    // Any dependency in the library configuration will also be added to the implementation configuration
    implementation.extendsFrom library

    shade
    library.extendsFrom shade
}

shadowJar {
    configurations = [project.configurations.shade]
    relocate 'com.github.JnCrMx:discord-game-sdk4j', 'modcraft.com.github.JnCrMx:discord-game-sdk4j:v0.5.5'

    archiveBaseName = "ModcraftMod"
    archiveVersion = "1.0"
    //finalizedBy 'reobfShadowJar'
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }
assemble.dependsOn shadowJar

repositories {
    maven { url 'https://jitpack.io' }
    maven { url = 'https://maven.modcraftmc.fr/snapshots' }
    maven { url = 'https://maven.modcraftmc.fr/releases' }
    maven {
        url "https://cursemaven.com"
    }
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so:
    // flatDir {
    //     dir 'libs'
    // }
}

dependencies {
    // Specify the version of Minecraft to use. If this is any group other than 'net.minecraft' it is assumed
    // that the dep is a ForgeGradle 'patcher' dependency, and its patches will be applied.
    // The userdev artifact is a special name and will get all sorts of transformations applied to it.
    implementation "net.neoforged:neoforge:${neo_version}"
    shade 'com.github.JnCrMx:discord-game-sdk4j:v0.5.5'
    //implementation("fr.modcraftmc:cross-server-core:1.2.3:api")
    implementation "curse.maven:ftbteams-404468:4611938"
    implementation "curse.maven:ftbchunks-314906:5001266"
    implementation "curse.maven:ftblib-404465:4661834"
    implementation "curse.maven:architectury-419699:5137942"
    implementation "curse.maven:emi-580555:5311324"
    // Real mod deobf dependency examples - these get remapped to your current mappings
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}:${jei_version}:api") // Adds JEI API as a compile dependency
    // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}:${jei_version}") // Adds the full JEI mod as a runtime dependency
    // implementation fg.deobf("com.tterrag.registrate:Registrate:MC${mc_version}-${registrate_version}") // Adds registrate as a dependency

    // Examples using mod jars from ./libs
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// Example for how to get properties into the manifest for reading at runtime.
jar {
    manifest {
        attributes([
                "Specification-Title": "modcraftmodreborn",
                //"Specification-Vendor": "modcraftmodreborn authors",
                "Specification-Version": "1", // We are version 1 of ourselves
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "Release-Type": release_type,
                "Build-Time": new Date().format("ddMMyyy-HHmm")
        ])
    }
}
jar.finalizedBy('shadowJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
